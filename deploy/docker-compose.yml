# 知芽 Learnly 本地 / 单机编排
# 使用：cp .env.example .env && docker compose up -d --build
services:
  postgres:
    image: postgres:16-alpine
    container_name: learnly-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learnly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnly}
      POSTGRES_DB: ${POSTGRES_DBNAME:-learnly}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learnly}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: learnly-redis
    command: redis-server --appendonly yes
    ports:
      # 宿主机 6379 已被 scpc-redis 占用，映射到 16379；容器内仍为 6379
      - "16379:6379"
    volumes:
      - redisdata:/data

  ai-service:
    build:
      context: ../ai-service
    container_name: learnly-ai-service
    env_file: .env
    ports:
      # 宿主机 8000/18000 已被占用（本地服务/rinetd），映射到 28000；容器内仍为 8000
      - "28000:8000"
    depends_on:
      - redis

  backend:
    build:
      context: ../backend
    container_name: learnly-backend
    env_file: .env
    environment:
      SERVER_PORT: "8080"
      SERVER_MODE: "release"
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      AI_BASEURL: http://ai-service:8000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ai-service:
        condition: service_started

  frontend:
    build:
      context: ../frontend
    container_name: learnly-frontend
    ports:
      - "8888:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:

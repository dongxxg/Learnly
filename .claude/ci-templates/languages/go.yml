# Uni-AURI CI Template — Go 语言默认变量
# 用法：include 此文件设置 Go 项目的 BUILD_IMAGE/CHECK_CMD/TEST_CMD
# TEST_CMD 已包含 -coverprofile，跑测试时同时产出覆盖率数据；
# COVERAGE_CMD 是纯解析命令（基于 coverage.out），不会重跑测试。

variables:
  BUILD_IMAGE: "hub.unitechs.com/public/gitlab/gitlab-runner-all-in-one:20250509"
  CHECK_CMD: "golangci-lint run"
  TEST_CMD: "go test -coverprofile=coverage.out ./..."
  COVERAGE_CMD: "go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%'"
